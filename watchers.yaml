watchers:
  - name: wa-daemon-health
    type: log-tail
    path: /Volumes/4TB-990/dev/claude-clawos/logs/wa-daemon.log
    triggers:
      - regex: disconnected|ready=false|reconnect failed|message handler error
        debounce_sec: 60
        actions:
          - send-telegram: |-
              WhatsApp daemon issue: {match}

              If it doesn't recover in ~30s, restart with:
              pkill -f wa-daemon && cd /Volumes/4TB-990/dev/claude-clawos && nohup /opt/homebrew/Cellar/node@20/20.19.6/bin/node ./node_modules/.bin/tsx scripts/wa-daemon.ts > logs/wa-daemon.log 2>&1 &
  - name: tunnel-health
    type: log-tail
    path: /tmp/clawos-tunnel.log
    triggers:
      - regex: ERR Request failed|Connection refused|Connection terminated|connection lost
        debounce_sec: 120
        actions:
          - send-telegram: 'Cloudflare tunnel: {match}'
  - name: bot-fatal
    type: log-tail
    path: /tmp/claudeclaw-main.log
    triggers:
      - regex: EADDRINUSE|UnhandledPromiseRejection|uncaught exception|Bot.*crashed|subprocess_crash|subprocess crashed|process exited with code [^0]|Not logged in|Please run /login|Agent query failed|Claude Code returned an error result
        debounce_sec: 30
        actions:
          - send-telegram: |-
              Bot trouble: {match}

              Main bot is hitting agent errors. If it's auth: SSH in and run `claude login` for HOME=/Users/dev. If subprocess crash: launchctl kickstart -k gui/$(id -u)/com.claudeclaw.main
  - name: warroom-voice-health
    type: log-tail
    path: /tmp/warroom-debug.log
    triggers:
      - regex: 1005|signaling socket closed|Connection closed unexpectedly|pipeline error
        debounce_sec: 60
        actions:
          - send-telegram: 'War Room voice connection issue: {match}'
  - name: stuck-mission-tasks
    type: sqlite-poll
    sql: |
      SELECT id, title, assigned_agent
      FROM mission_tasks
      WHERE status='queued'
        AND created_at < strftime('%s','now') - 600
        AND id > '{cursor}'
      ORDER BY id ASC
      LIMIT 5
    interval_sec: 60
    cursor_column: id
    actions:
      - queue-mission:
          agent: meta
          title: 'Stuck task triage: {title}'
          prompt: Mission task {id} ({title}, assigned to {assigned_agent}) has been queued for over 10 minutes. Check why it hasn't started. If the assigned agent is overloaded, reassign to a different specialist or escalate to me.
  - name: meet-session-stale-cleanup
    type: sqlite-poll
    sql: |
      SELECT id, agent_id, meet_url
      FROM meet_sessions
      WHERE status='live'
        AND created_at < strftime('%s','now') - 7200
    interval_sec: 300
    actions:
      - mark-meet-stale:
          id_field: id
      - send-telegram: Auto-closed stale meet session {id} ({meet_url}) — was 'live' >2h
  - name: incoming-whatsapp-vip
    type: sqlite-poll
    sql: |
      SELECT id, contact_name, body
      FROM wa_messages
      WHERE is_from_me=0
        AND id > {cursor}
        AND contact_name IN ('Sven Lepschy', 'Ryan Claudio')
      ORDER BY id ASC
      LIMIT 5
    interval_sec: 30
    cursor_column: id
    actions:
      - queue-mission:
          agent: comms
          title: Reply to {contact_name} on WhatsApp
          prompt: |-
            New WhatsApp from {contact_name}: "{body}"

            Draft a reply matching Joe's voice. If you're unsure of context or the right answer, ask Joe before sending. If it's a quick acknowledgment that obviously doesn't need approval, send via the whatsapp_send tool.
  # Live broker pipeline (public.signals → ceddi-only).
  # Bridge: supabase/functions/clawos-ceddi-bridge/.
  # Stance: HIGH-attention. Agent may escalate to Telegram ping.
  - name: trading-monitor-trigger
    type: webhook
    slug: trading-monitor
    secret_env: TRADING_MONITOR_SECRET
    mode: test
    actions:
      - queue-mission:
          agent: trading-monitor
          title: "Live signal: {payload.provider} {payload.side} {payload.entry}"
          prompt: |
            LIVE signal from the broker dispatch pipeline (public.signals).
            Source = ceddi (the only kind that writes here).

            ── Payload ──────────────────────────────────────────
            {payload_raw}
            ─────────────────────────────────────────────────────

            Your job (per your CLAUDE.md):

            1. Parse: provider, side, instrument, entry, sl, tp[], status, signal_type.
            2. Enrich (use the skills you have — judgment on which to call):
               - lab-query-channel-credibility — does this provider's recent SL/TP
                 accuracy justify high-priority treatment?
               - lab-query-signal-performance  — provider's recent win rate / TP-hit rate.
               - lab-query-drawdown-profile    — only if signal looks like it
                 follows a streak.
            3. Classify priority:
               - high  → conviction signal from a credible provider (>70% credibility,
                         clean entry, sane SL/TP). Telegram-notify Joe.
               - medium → normal signal. Log only.
               - low   → degenerate fields (missing SL, parser warnings, low-cred provider).
            4. Log one structured row to hive_mind:
               - action  = signal-received
               - summary = "PROVIDER=… SIDE=… INST=… ENTRY=… SL=… TP=… PRIORITY=…"
               - chat_id = 'system'
            5. Reply with the tight bullet output described in your CLAUDE.md.

            Hard rules: never trade, never send orders, never DM the source channel.

  # Observation-only L1 ingest (analysis.signals_l1).
  # Currently 4 providers: ceddi (shadow), gold_scalping, goldsignals_swing,
  # goldsignals_intraday. Bridge: supabase/functions/clawos-ingest-bridge/.
  # Stance: SILENT. Log only. Never escalate to Telegram from this path.
  - name: trading-monitor-ingest
    type: webhook
    slug: trading-monitor-ingest
    secret_env: TRADING_MONITOR_INGEST_SECRET
    mode: test
    actions:
      - queue-mission:
          agent: trading-monitor
          title: "Ingest: {payload.provider} {payload.side} {payload.entry}"
          prompt: |
            OBSERVATION-ONLY ingest signal from analysis.signals_l1.
            Source = one of: gold_scalping | goldsignals_swing | goldsignals_intraday | ceddi (shadow row).

            ── Payload ──────────────────────────────────────────
            {payload_raw}
            ─────────────────────────────────────────────────────

            Your job (per your CLAUDE.md):

            1. Parse the L1 fields (provider, side, entry_low/high/mid, sl, tp_levels,
               is_buy_now, is_split_message, parser_warnings, raw_text).
            2. Log one structured row to hive_mind:
               - action  = ingest-signal
               - summary = "PROVIDER=… SIDE=… ENTRY=… SL=… TP=… BUY_NOW=… WARN=…"
               - chat_id = 'system'
            3. Reply with a single-line summary. Don't run lab-query skills unless
               something looks broken (parser_warnings non-empty, missing SL, etc.) —
               we're aggregating these into a daily/weekly view, not reacting per signal.

            Hard rules: NEVER notify Joe via Telegram from this path. NEVER trade.
            NEVER send orders. NEVER DM the source channel. Pure observation, log
            structured, move on.

  - name: n8n-error-router
    type: webhook
    slug: n8n-error
    secret_env: N8N_ERROR_SECRET
    mode: test
    actions:
      - lookup-owner:
          workflow_field: workflow_id
          signature_field: error_signature
          debounce_sec: 60
      - if-owned:
          - queue-mission:
              agent: '{_owner_agent}'
              title: 'n8n error: {payload.workflow_name} ({_workflow_id})'
              prompt: |
                An n8n workflow you own errored out.

                Workflow: {payload.workflow_name} (id: {_workflow_id})
                Error: {payload.error_message}
                Execution: {payload.execution_url}

                Raw payload:
                {payload_raw}

                Investigate the failure. If it's transient, note it and stand down. If the workflow needs a code/config fix, propose the fix and (when safe) apply it via the n8n CLI. Do NOT modify other agents' workflows.
      - if-unowned:
          - queue-mission:
              agent: meta
              title: 'n8n triage: unowned workflow {_workflow_id}'
              prompt: |
                An n8n workflow with no registered owner errored out.

                Workflow: {payload.workflow_name} (id: {_workflow_id})
                Error: {payload.error_message}
                Execution: {payload.execution_url}

                Raw payload:
                {payload_raw}

                Decide which agent should own this workflow going forward. To assign:
                  sqlite3 store/claudeclaw.db "INSERT INTO n8n_workflow_owners (workflow_id, agent_id, created_at) VALUES ('{_workflow_id}', '<agent>', strftime('%s','now'));"
                Then re-run the workflow in n8n to confirm routing.
          - send-slack:
              webhook_url_env: SLACK_WEBHOOK_URL
              channel: integration-alerts
              template: |
                :rotating_light: Unowned n8n workflow errored.
                Workflow: {payload.workflow_name} (id: {_workflow_id})
                Error: {payload.error_message}
                Triage at https://clawos.joetroyer.com/mission
